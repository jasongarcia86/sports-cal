name: Update calendar feed

on:
  schedule:
    # every 6 hours; cron is UTC. GitHub delays scheduled runs under load,
    # so don't count on the exact minute.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: python build_ics.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs; then
            echo "no schedule changes"
          else
            git add docs
            git commit -m "chore: refresh schedules ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
